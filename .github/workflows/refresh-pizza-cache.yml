name: Refresh Pizza ontology cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Require a feature branch
        if: github.ref_name == 'main'
        run: |
          echo "Run this workflow from a feature branch; direct updates to main are not allowed."
          exit 1

      - name: Check out selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh cache from canonical source
        run: python tools/pizza_cache.py refresh

      - name: Verify refreshed cache
        run: python tools/pizza_cache.py verify

      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/cache/pizza.owl source/cache/pizza-manifest.json
          if git diff --cached --quiet; then
            echo "Cache is already current."
          else
            git commit -m "Refresh cached Pizza ontology"
            git push
          fi
